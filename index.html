<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crm-logo.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/crm-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVFORGE CRM — Gestión Comercial, WhatsApp & Comunicaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var preferencia = localStorage.getItem('crm_tema_preferencia');
        if (!preferencia) {
          preferencia = localStorage.getItem('crm_tema_visual') || 'system';
        }
        var esOscuro = preferencia === 'dark' ||
          (preferencia === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (esOscuro) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-300">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
