<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="crmGradient" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Base Squircle de Fondo Oscuro -->
  <rect width="512" height="512" rx="120" fill="#09090b" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#27272a" stroke-width="2" opacity="0.6" />
  
  <!-- Símbolo Minimalista C con Chevron de Avance -->
  <g filter="url(#glow)">
    <!-- Arco C exterior -->
    <path 
      d="M 335 155 A 140 140 0 1 0 335 357" 
      stroke="url(#crmGradient)" 
      stroke-width="38" 
      stroke-linecap="round" 
      fill="none" 
    />
    <!-- Chevron / Flecha de Pipeline interna -->
    <path 
      d="M 250 200 L 315 256 L 250 312" 
      stroke="url(#crmGradient)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
  </g>
</svg>
